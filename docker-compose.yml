services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindguess
      POSTGRES_PASSWORD: mindguess
      POSTGRES_DB: mindguess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindguess -d mindguess"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mindguess:mindguess@db:5432/mindguess
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
